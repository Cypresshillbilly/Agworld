<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">GAME CHANGER</title>
<desc id="desc">GAME CHANGER — DOMINATE THE TERRITORY — Build relationships. Drive sales. WIN THE FUTURE.</desc>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7f7f5"/><stop offset=".18" stop-color="#bfc2bd"/>
    <stop offset=".35" stop-color="#ffffff"/><stop offset=".55" stop-color="#777c78"/>
    <stop offset=".72" stop-color="#e9eae7"/><stop offset="1" stop-color="#5d625f"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b8df38"/><stop offset=".28" stop-color="#86b91f"/>
    <stop offset=".55" stop-color="#4c8f20"/><stop offset=".78" stop-color="#8fbf26"/>
    <stop offset="1" stop-color="#315e18"/>
  </linearGradient>
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="8" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncA type="table" tableValues="0 .18"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity=".45"/>
  </filter>
</defs>

<!-- segmented G/C emblem -->
<g transform="translate(55 55)" filter="url(#shadow)">
  <path d="M180 15 A165 165 0 0 0 30 245" fill="none" stroke="url(#green)" stroke-width="42" stroke-linecap="butt" filter="url(#rough)"/>
  <path d="M72 275 A165 165 0 0 0 292 70" fill="none" stroke="url(#green)" stroke-width="42" stroke-linecap="butt" filter="url(#rough)"/>
  <path d="M100 228 A118 118 0 1 1 218 120 L278 120" fill="none" stroke="url(#metal)" stroke-width="40" stroke-linecap="butt" filter="url(#rough)"/>
  <path d="M218 120 L218 205 L305 205" fill="none" stroke="url(#metal)" stroke-width="40" stroke-linecap="square" filter="url(#rough)"/>
</g>

<!-- wordmark -->
<g transform="translate(390 105)" filter="url(#shadow)">
  <text x="0" y="95" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="900" letter-spacing="2" fill="url(#metal)" filter="url(#rough)">GAME</text>
  <text x="0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="900" letter-spacing="0" fill="url(#green)" filter="url(#rough)">CHANGER</text>
  <line x1="0" y1="245" x2="70" y2="245" stroke="#8fbd27" stroke-width="6"/>
  <text x="88" y="258" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="6" fill="#f4f5f2">DOMINATE THE TERRITORY</text>
  <line x1="690" y1="245" x2="760" y2="245" stroke="#8fbd27" stroke-width="6"/>
  <text x="0" y="320" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f4f5f2">Build relationships. Drive sales. </text>
  <text x="515" y="320" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#9acb25">WIN THE FUTURE.</text>
</g>
</svg>