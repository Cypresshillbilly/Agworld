name: AG World V1 Boot Regression

on:
  workflow_call:
  push:
    paths:
      - 'AG WORLD/index.html'
      - 'AG WORLD/login/v1/**'
      - 'AG WORLD/boot/v1/**'
      - 'AG WORLD/app-gis-loader-v24.js'
      - 'AG WORLD/main-game-layout-v1.js'
      - 'AG WORLD/agworld-player-surface-final-v1.js'
      - 'AG WORLD/agworld-landing-game-layer-v1.js'
      - 'AG WORLD/agworld-final-layer-cleanup-v2.js'
      - 'AG WORLD/agworld-player-progression-stack-v1.js'
      - 'AG WORLD/agworld-mission-control-card-polish-v1.js'
      - 'AG WORLD/shared-farm-world-v38.js'
      - 'AG WORLD/menu-settings-logout.js'
      - 'AG WORLD/profile-menu-refinement.js'
      - 'AG WORLD/player-menu-panels.js'
      - 'AG WORLD/player-progression-v27.js'
      - 'AG WORLD/game-view-mode.js'
      - 'AG WORLD/branded-sidebar.js'
      - 'AG WORLD/game-reference-theme.*'
      - 'AG WORLD/assets/fonts/**'
      - 'AG WORLD/assets/missions/**'
      - 'AG WORLD/developer-*'
      - 'AG WORLD/system-administrator-guide.js'
      - 'AG WORLD/player-sales-dashboard.js'
      - 'AG WORLD/shared-backend-v37.js'
      - 'AG WORLD/interactive-onboarding-v28.js'
      - 'AG WORLD/assets/advisors/**'
      - 'AG WORLD/assets/audio/**'
      - 'AG WORLD/assets/brand/**'
      - '.github/tests/**'
      - '.github/workflows/agworld-v1-boot-regression.yml'
  pull_request:
    paths:
      - 'AG WORLD/index.html'
      - 'AG WORLD/login/v1/**'
      - 'AG WORLD/boot/v1/**'
      - 'AG WORLD/app-gis-loader-v24.js'
      - 'AG WORLD/main-game-layout-v1.js'
      - 'AG WORLD/agworld-player-surface-final-v1.js'
      - 'AG WORLD/agworld-landing-game-layer-v1.js'
      - 'AG WORLD/agworld-final-layer-cleanup-v2.js'
      - 'AG WORLD/agworld-player-progression-stack-v1.js'
      - 'AG WORLD/agworld-mission-control-card-polish-v1.js'
      - 'AG WORLD/shared-farm-world-v38.js'
      - 'AG WORLD/menu-settings-logout.js'
      - 'AG WORLD/profile-menu-refinement.js'
      - 'AG WORLD/player-menu-panels.js'
      - 'AG WORLD/player-progression-v27.js'
      - 'AG WORLD/game-view-mode.js'
      - 'AG WORLD/branded-sidebar.js'
      - 'AG WORLD/game-reference-theme.*'
      - 'AG WORLD/assets/fonts/**'
      - 'AG WORLD/assets/missions/**'
      - 'AG WORLD/developer-*'
      - 'AG WORLD/system-administrator-guide.js'
      - 'AG WORLD/player-sales-dashboard.js'
      - 'AG WORLD/shared-backend-v37.js'
      - 'AG WORLD/interactive-onboarding-v28.js'
      - 'AG WORLD/assets/advisors/**'
      - 'AG WORLD/assets/audio/**'
      - 'AG WORLD/assets/brand/**'
      - '.github/tests/**'
      - '.github/workflows/agworld-v1-boot-regression.yml'

permissions:
  contents: read

jobs:
  verify-v1-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical boot contract
        run: |
          node 'AG WORLD/boot/v1/verify.mjs'
          node --check 'AG WORLD/boot/v1/three.mjs'
          node 'AG WORLD/boot/v1/boot.test.mjs'
          node .github/tests/sales-dashboard.test.mjs
          node 'AG WORLD/boot/v1/verify-dependencies.mjs'
      - name: Install pinned browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/agworld-tests" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/agworld-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise login, refresh, logout and failed-load recovery
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/agworld-tests/node_modules/playwright/index.mjs
        run: node .github/tests/browser-boot.mjs
