name: Deploy AG World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runtime Google Maps configuration
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          printf 'window.AG_WORLD_CONFIG = { GOOGLE_MAPS_API_KEY: %s };\n' "$(printf '%s' "$GOOGLE_MAPS_API_KEY" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test AG World API
        run: |
          set -e
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused https://ag-world-api.onrender.com/api/health
          echo
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused https://ag-world-api.onrender.com/api/farms
          echo
          echo "AG World API smoke test passed."
