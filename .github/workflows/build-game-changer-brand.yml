name: Build Game Changer Brand Derivatives

on:
  push:
    branches: [main]
    paths:
      - 'GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/**'
      - '.github/workflows/build-game-changer-brand.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip gc brand build]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Build PNG transparent and JPG derivatives
        shell: bash
        run: |
          set -euo pipefail

          render() {
            local src="$1"
            local png="$2"
            local jpg="$3"
            local bg="$4"
            local tmp
            tmp="$(mktemp --suffix=.svg)"

            # Remove the full-canvas background rectangle for transparent PNG output.
            python3 - "$src" "$tmp" <<'PY'
import re, sys
src, dst = sys.argv[1], sys.argv[2]
data = open(src, encoding='utf-8').read()
data = re.sub(r'<rect width="[0-9]+" height="[0-9]+" fill="(?:#[0-9A-Fa-f]+|white)"/>', '', data, flags=re.I)
open(dst, 'w', encoding='utf-8').write(data)
PY

            mkdir -p "$(dirname "$png")" "$(dirname "$jpg")"

            rsvg-convert --keep-aspect-ratio --width 2400 "$tmp" -o "$png"
            rsvg-convert --keep-aspect-ratio --width 2400 "$src" -o "$jpg.png"
            magick "$jpg.png" -background "$bg" -alpha remove -alpha off -quality 94 "$jpg"
            rm -f "$tmp" "$jpg.png"
          }

          render GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/PRIMARY/SVG/GameChanger_Primary_Dark_v1.2.svg \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/PRIMARY/PNG_Transparent/GameChanger_Primary_Dark_v1.2.png \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/PRIMARY/JPG/GameChanger_Primary_Dark_v1.2.jpg '#090b08'

          render GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/PRIMARY/SVG/GameChanger_Primary_White_v1.2.svg \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/PRIMARY/PNG_Transparent/GameChanger_Primary_White_v1.2.png \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/PRIMARY/JPG/GameChanger_Primary_White_v1.2.jpg '#ffffff'

          render GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/HORIZONTAL/SVG/GameChanger_Horizontal_Dark_v1.2.svg \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/HORIZONTAL/PNG_Transparent/GameChanger_Horizontal_Dark_v1.2.png \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/HORIZONTAL/JPG/GameChanger_Horizontal_Dark_v1.2.jpg '#090b08'

          render GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/HORIZONTAL/SVG/GameChanger_Horizontal_White_v1.2.svg \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/HORIZONTAL/PNG_Transparent/GameChanger_Horizontal_White_v1.2.png \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/HORIZONTAL/JPG/GameChanger_Horizontal_White_v1.2.jpg '#ffffff'

          render GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/STACKED/SVG/GameChanger_Stacked_White_v1.2.svg \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/STACKED/PNG_Transparent/GameChanger_Stacked_White_v1.2.png \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/STACKED/JPG/GameChanger_Stacked_White_v1.2.jpg '#ffffff'

          render GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/ICON/SVG/GameChanger_Icon_Dark.svg \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/ICON/PNG_Transparent/GameChanger_Icon_Dark_v1.2.png \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/ICON/JPG/GameChanger_Icon_Dark_v1.2.jpg '#090b08'

          render GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/ICON/SVG/GameChanger_Icon_White.svg \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/ICON/PNG_Transparent/GameChanger_Icon_White_v1.2.png \
            GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE/ICON/JPG/GameChanger_Icon_White_v1.2.jpg '#ffffff'

      - name: Commit generated derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GAME CHANGER/BRAND/RETIRED_V1.2_REFERENCE
          if git diff --cached --quiet; then
            echo "No derivative changes to commit"
          else
            git commit -m "brand(game-changer): generate v1.2 raster derivatives [skip gc brand build]"
            git push
          fi
